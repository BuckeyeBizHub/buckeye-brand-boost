name: Copy photos off Lovable storage

# One-time job: Lovable's Supabase storage goes away when Lovable is
# cancelled, so copy the job photos the site uses into public/photos.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -euo pipefail
          base="https://ustxmgctwrjdzcpsrewb.supabase.co/storage/v1/object/public/photos"
          mkdir -p public/photos
          while read -r f; do
            [ -z "$f" ] && continue
            curl -fsSL --retry 3 -o "public/photos/$f" "$base/$f"
          done < scripts/lovable-photos.txt
          ls public/photos | wc -l
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos
          git commit -m "Copy job photos off Lovable storage"
          git push
